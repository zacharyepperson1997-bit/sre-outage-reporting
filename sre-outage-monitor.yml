name: SRE Individual Outage Monitor

on:
  schedule:
    # Check every five minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sre-individual-outage-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check individual SRE outages and send SMS alerts
        env:
          SRE_OUTAGES_URL: "https://outage.srelectric.com/data/outages.json"
          SRE_THRESHOLD: "250"
          MISSING_POLLS_TO_RESTORE: "2"
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          TWILIO_TO_NUMBER: ${{ secrets.TWILIO_TO_NUMBER }}
        run: python monitor.py

      - name: Save outage tracking state
        run: |
          if git diff --quiet -- state.json; then
            echo "No outage-state changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update individual outage tracking state"
          git push
